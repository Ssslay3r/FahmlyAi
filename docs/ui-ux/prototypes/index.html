const mascot=(cls='mascot-art',state=S.mascot)=>`<img class="${cls}" data-mascot src="${assets[states[state][0]]}" alt="${text('Rafeeq — '+states[state][1],'رفيق — '+states[state][2])}">`;

function setState(state){if(!states[state])return;S.mascot=state;document.querySelectorAll('[data-mascot]').forEach(el=>{el.src=assets[states[state][0]];el.alt=text('Rafeeq — '+states[state][1],'رفيق — '+states[state][2]);});document.querySelectorAll('[data-status]').forEach(el=>el.textContent=text(states[state][1],states[state][2]));$('#announcer').textContent=text(states[state][1],states[state][2]);if($('#state-select'))$('#state-select').value=state;}
function toast(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,4000);}
function brand(){return `<button class="brand" style="border:0;background:none;padding:0;text-align:start" data-page="home" aria-label="${label('home')}"><img src="${assets.default}" alt=""><span><strong>Fahmly</strong><small>Your Smarter Way to Learn.</small></span></button>`;}
function docTitle(d){return S.lang==='ar'?esc(d.ar):`<bdi dir="ltr">${esc(d.name)}</bdi>`;}
function docRows(limit=99){const rows=documents.map((d,i)=>({d,i})).filter(({d})=>(d.name+' '+d.ar).toLowerCase().includes(S.query.toLowerCase())).slice(0,limit);return rows.length?rows.map(({d,i})=>`<button class="document-row" data-doc="${i}"><span class="file-icon">${d.type}</span><span class="grow"><strong>${docTitle(d)}</strong><small>${d.pages} ${text(d.type==='PPTX'?'slides':'pages',d.type==='PPTX'?'شريحة':'صفحة')} · ${text(...d.age)}</small></span><span class="pill success">${text('Ready','جاهز')}</span>${icon('arrow','arrow')}</button>`).join(''):`<div class="empty"><h3>${text('No matching documents','لا توجد مستندات مطابقة')}</h3><p>${text('Try another search or add an example document.','جرّب بحثاً آخر أو أضف مستنداً تجريبياً.')}</p></div>`;}
function render(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';document.documentElement.dataset.theme=S.theme;document.body.classList.toggle('phone',S.phone);const nav=['home','chat','documents','quiz','subjects','notes','calendar','profile'];$('#root').innerHTML=`<div class="preview-bar"><span class="preview-label"><i></i><strong>Fahmly v2</strong><span>${text('Design prototype · sample data','نموذج تصميم · بيانات تجريبية')}</span></span><div class="preview-tools">${btn('phone',S.phone?'Desktop view':'Phone view',S.phone?'عرض سطح المكتب':'عرض الهاتف')}${btn('theme',S.theme==='light'?'Dark':'Light',S.theme==='light'?'داكن':'فاتح',false,S.theme==='light'?'moon':'sun')}${btn('lang',S.lang==='en'?'العربية':'English',S.lang==='en'?'العربية':'English')}${btn('design','Design system','نظام التصميم')}</div></div><div class="shell"><aside class="sidebar">${brand()}<nav class="nav" aria-label="${text('Main navigation','التنقل الرئيسي')}">${nav.map(n=>`<button ${['subjects','notes','calendar'].includes(n)?'disabled':''} class="${S.page===n?'active':''}" data-page="${n}" ${S.page===n?'aria-current="page"':''}>${icon(n)}${label(n)}${['subjects','notes','calendar'].includes(n)?`<span class="later">${text('LATER','لاحقاً')}</span>`:''}</button>`).join('')}</nav><div class="sidebar-tip"><img src="${assets.happy}" alt=""><h3>${text('A little every day.','خطوة صغيرة كل يوم.')}</h3><p>${text('Understand one idea. Ask a question. Give it a try.','افهم فكرة، واسأل سؤالاً، ثم جرّب بنفسك.')}</p></div><small>${text('Your study space, your pace.','مساحتك للدراسة، على راحتك.')}</small></aside><div class="workspace"><header class="topbar"><form class="search" id="search-form">${icon('search')}<label class="sr-only" for="global-search">${text('Search documents','ابحث في المستندات')}</label><input id="global-search" value="${esc(S.query)}" placeholder="${text('Search your learning materials…','ابحث في موادك الدراسية…')}"><button class="btn icon quiet" aria-label="${text('Search','بحث')}">${icon('arrow','arrow')}</button></form><button class="btn quiet" data-page="onboarding">${text('Meet Rafeeq','تعرّف على رفيق')}</button><span class="avatar">S</span><span class="student-name small">${text('Student','طالب')}</span></header><main id="main" class="content" tabindex="-1">${screen()}</main></div><nav class="bottom-nav" aria-label="${text('Mobile navigation','التنقل على الهاتف')}">${['home','chat','upload','quiz','profile'].map(n=>`<button class="${n==='upload'?'upload':S.page===n?'active':''}" ${n==='upload'?'data-action="upload-page"':`data-page="${n}"`} aria-label="${n==='upload'?text('Upload document','رفع مستند'):label(n)}">${icon(n)}${n==='upload'?'':n==='chat'?text('Chat','الدردشة'):label(n)}</button>`).join('')}</nav></div>`;bind();$('#announcer').textContent=text(states[S.mascot][1],states[S.mascot][2]);}
function heading(title,subtitle){return `<div class="page-heading"><h1>${title}</h1><p>${subtitle}</p></div>`;}
function screen(){switch(S.page){case'home':return home();case'documents':return docs();case'summary':return summary();case'chat':return chat();case'quiz':return quiz();case'results':return results();case'profile':return profile();case'design':return design();case'onboarding':return onboarding();default:return home();}}
function home(){return `<div class="row between"><div><p class="eyebrow">${text('YOUR LEARNING SPACE','مساحتك للتعلم')}</p><h2 style="margin-top:6px">${text('Welcome back, student.','أهلاً بعودتك.')}</h2></div><span class="pill">${text('One idea at a time','فكرة تلو الأخرى')}</span></div><section class="hero"><div><span class="pill">${text('Meet your AI study companion','تعرّف على رفيقك الدراسي')}</span><h1>${text('Understand your studies.<br><span class="brand-text">Your way.</span>','افهم دراستك.<br><span class="brand-text">بطريقتك.</span>')}</h1><p>${text('Turn your lecture materials into clear explanations, focused summaries, and a little practice — with Rafeeq by your side.','حوّل محاضراتك إلى شروحات واضحة وملخصات مركزة وتدريب مفيد — مع رفيق إلى جانبك.')}</p><div class="actions row wrap">${btn('go-chat','Chat with Rafeeq','تحدث مع رفيق',true,'chat')}${btn('upload-page','Upload a document','ارفع مستنداً',false,'upload')}</div></div><div class="mascot-panel">${mascot('mascot-art float')}${status()}<span class="small">${text('Your smarter way to learn.','طريقتك الأذكى للتعلم.')}</span></div></section><section class="quick-actions" aria-label="${text('Study actions','أدوات الدراسة')}">${[['summary','documents','','Summarize','لخّص','The key ideas, clearly','الأفكار الأساسية بوضوح'],['explain','spark','purple','Explain','اشرح','Step by step','خطوة بخطوة'],['go-quiz','quiz','orange','Create quiz','أنشئ اختباراً','Practice what you learn','تدرب على ما تعلمته'],['go-chat','chat','cyan','Ask anything','اسأل رفيق','Start with a question','ابدأ بسؤال']].map(([a,i,c,e,r,s,t])=>`<button class="quick" data-action="${a}"><span class="icon-tile ${c}">${icon(i)}</span><span><strong>${text(e,r)}</strong><small>${text(s,t)}</small></span></button>`).join('')}</section><div class="lower-grid"><section><div class="section-head"><h2>${text('Recent documents','المستندات الأخيرة')}</h2>${btn('all-docs','See all','عرض الكل',false,'arrow')}</div><div class="document-list">${docRows(3)}</div></section><aside class="card study-card"><p class="eyebrow">${text('SAMPLE STUDY PROGRESS','تقدم دراسي تجريبي')}</p><div><span class="metric">3</span><p>${text('materials ready to explore','مواد جاهزة للتعلم')}</p></div><div class="progress-track"><div class="progress-fill" style="width:60%"></div></div><div class="row"><span class="mini-check">${icon('check')}</span><small>${text('Try your first practice quiz','جرّب أول اختبار تدريبي')}</small></div>${btn('go-quiz','Let’s practice','هيا نتدرب',false,'quiz')}</aside></div>`;}
function docs(){return `${heading(label('documents'),text('Your lectures, ready for a clearer understanding.','محاضراتك، جاهزة لفهم أوضح.'))}<div class="upload-zone"><span class="icon-tile">${icon('upload')}</span><h3>${text('Bring your learning material','أضف مادتك الدراسية')}</h3><p>${text('PDF, PPTX, or DOCX · filename-only demonstration','PDF أو PPTX أو DOCX · تجربة تستخدم اسم الملف فقط')}</p><label class="sr-only" for="file-input">${text('Choose an example file','اختر ملفاً للتجربة')}</label><input id="file-input" type="file" accept=".pdf,.pptx,.docx" ${S.processing?'disabled':''}>${btn('sample-upload','Try an example upload','جرّب رفع مستند تجريبي',true,'upload')}</div>${S.processing?`<div class="status-banner">${mascot('mascot-small') }<div class="grow"><strong>${esc(S.uploadName)}</strong><p class="small" data-status>${text(states[S.mascot][1],states[S.mascot][2])}</p><div class="progress-track" style="margin-top:10px"><div class="progress-fill" style="width:${S.mascot==='working'?30:70}%"></div></div></div></div>`:''}<div class="section-head"><h2>${text('Your library','مكتبتك')}</h2><span class="pill">${documents.length} ${text('documents','مستندات')}</span></div><div class="document-list">${docRows()}</div>`;}
function summary(){const d=documents[S.doc];return `${btn('all-docs','Back to documents','العودة للمستندات',false,'back')}<div class="context-card" style="margin-top:20px"><span class="file-icon">${d.type}</span><div class="grow"><h2>${docTitle(d)}</h2><p>${d.pages} ${text('pages / slides','صفحة / شريحة')} · ${text(...d.subject)}</p></div><span class="pill success">${text('Ready','جاهز')}</span></div><div class="tabs" role="tablist" aria-label="${text('Document study sections','أقسام دراسة المستند')}">${['summary','points','topics'].map((k,i)=>`<button id="tab-${k}" role="tab" aria-selected="${S.tab===k}" aria-controls="document-panel" data-tab="${k}" class="${S.tab===k?'active':''}">${text(['Summary','Key Points','Topics'][i],['الملخص','النقاط الأساسية','الموضوعات'][i])}</button>`).join('')}</div><section class="card reading" id="document-panel" role="tabpanel" aria-labelledby="tab-${S.tab}">${documentContent(d)}<button class="source-chip" data-action="citation">${icon('documents')}${text('Example reference · page 4','مرجع تجريبي · الصفحة 4')}</button></section><div class="row wrap" style="margin-top:24px">${btn('go-chat','Ask Rafeeq','اسأل رفيق',true,'chat')}${btn('go-quiz','Create a quiz','أنشئ اختباراً',false,'quiz')}</div><p class="small" style="margin-top:16px">${text('Sample summary for design review. It is not extracted from an uploaded file.','ملخص تجريبي لمراجعة التصميم، وليس مستخرجاً من ملف مرفوع.')}</p>`;}
function documentContent(d){const network=d.name==='Computer Networks.pdf';const title=text(...d.subject);if(S.tab==='summary')return `<p class="eyebrow">${text('THE BIG PICTURE','الصورة العامة')}</p><h2 style="margin-top:10px">${title}</h2><p>${network?text('A computer network lets devices share information. Data travels in packets, and protocols define how those packets are addressed, transported, and received.','تتيح شبكة الحاسوب للأجهزة تبادل المعلومات. تنتقل البيانات في حزم، وتحدد البروتوكولات كيفية عنونتها ونقلها واستقبالها.'):text('This example introduces the central concepts of '+title+' and shows how Rafeeq would organize a lecture into manageable learning sections.','يقدم هذا المثال المفاهيم الأساسية لمادة '+title+' ويوضح كيف يمكن لرفيق تنظيم المحاضرة إلى أقسام سهلة الفهم.')}</p><p>${network?text('Think of TCP as a tracked delivery: it checks that the pieces arrive in order. UDP is more like sending quick postcards: it favors speed without the same delivery guarantees.','تخيّل TCP مثل شحنة يتم تتبعها: يتحقق من وصول الأجزاء بالترتيب. أما UDP فيشبه إرسال بطاقات سريعة؛ يعطي أولوية للسرعة دون ضمانات الوصول نفسها.'):text('Use the key points to identify the main ideas, then ask a question or practice with a quiz.','استخدم النقاط الأساسية لتحديد الأفكار المهمة، ثم اسأل سؤالاً أو تدرب باختبار.')}</p>`;const list=S.tab==='points'?[text('Devices exchange information through packets.','تتبادل الأجهزة المعلومات عبر الحزم.'),text('IP addresses identify network interfaces.','تحدد عناوين IP واجهات الشبكة.'),text('TCP prioritizes reliable delivery; UDP prioritizes low overhead.','يعطي TCP أولوية للموثوقية، بينما يقلل UDP الحمل الإضافي.')]:[text('1. Network types — LAN, MAN, WAN','1. أنواع الشبكات — LAN وMAN وWAN'),text('2. IP addressing and routing','2. عنونة IP والتوجيه'),text('3. Transport protocols — TCP and UDP','3. بروتوكولات النقل — TCP وUDP')];return `<h2>${text(S.tab==='points'?'Remember these ideas':'Explore the lecture',S.tab==='points'?'تذكر هذه الأفكار':'استكشف المحاضرة')}</h2><ul>${(network?list:[text('Core concepts and terminology','المفاهيم والمصطلحات الأساسية'),text('Worked examples and comparisons','أمثلة تطبيقية ومقارنات'),text('Questions for self-checking','أسئلة للتحقق من الفهم')]).map(x=>`<li>${x}</li>`).join('')}</ul>`;}
function greetingMessage(){return text('Hi! I’m Rafeeq. Choose a document and ask me what you’d like to understand. We can take it one idea at a time.','أهلاً! أنا رفيق. اختر مستنداً واسألني عما تريد فهمه. نقدر نتعلم فكرة تلو الأخرى.');}
function chat(){const d=documents[S.doc];return `${heading(label('chat'),text('A clearer explanation starts with a good question.','الشرح الأوضح يبدأ بسؤال.'))}<div class="context-card"><span class="file-icon">${d.type}</span><div class="grow"><strong>${docTitle(d)}</strong><p>${text('Document context · sample citations','سياق المستند · مراجع تجريبية')}</p></div>${btn('summary','View summary','عرض الملخص',false,'documents')}</div><div class="chat-layout"><section class="chat-box"><div class="chat-header row">${mascot('mascot-small')}<div><strong>${text('Rafeeq','رفيق')}</strong><p class="small" data-status>${text(states[S.mascot][1],states[S.mascot][2])}</p></div><span class="pill" style="margin-inline-start:auto">${text('Sample chat','دردشة تجريبية')}</span></div><div class="messages" id="messages">${messageHTML()}</div><form id="chat-form" class="composer"><label class="sr-only" for="chat-input">${text('Your question','سؤالك')}</label><textarea id="chat-input" rows="1" placeholder="${text('Ask Rafeeq about your material…','اسأل رفيق عن مادتك…')}" ${S.busy?'disabled':''}></textarea><button class="btn primary icon" ${S.busy?'disabled':''} aria-label="${text('Send question','أرسل السؤال')}">${icon('send')}</button></form></section><aside class="card mentor chat-side">${mascot('mascot-art float')}${status()}<h3>${text('Here to help you understand.','هنا لمساعدتك على الفهم.')}</h3><p>${text('Ask for a simpler explanation, an example, or the key ideas.','اطلب شرحاً أبسط أو مثالاً أو أهم الأفكار.')}</p></aside></div><div class="suggestions">${btn('ask-summary','Summarize this document','لخّص هذا المستند',false,'documents')}${btn('ask-explain','Explain simply','اشرح ببساطة',false,'spark')}${btn('go-quiz','Create a quiz','أنشئ اختباراً',false,'quiz')}</div><div class="row wrap" style="margin-top:20px">${btn('simulate-error','Preview error','معاينة الخطأ')}${btn('simulate-offline','Preview offline','معاينة انقطاع الاتصال')}${S.error?btn('recover','Retry','حاول مجدداً',true):''}${S.offline?btn('recover','Reconnect','إعادة الاتصال',true):''}</div>${S.error||S.offline?`<div class="feedback"><strong>${text(S.offline?'You’re offline.':'We couldn’t complete that request.',S.offline?'أنت غير متصل.':'تعذر إكمال الطلب.')}</strong><p>${text('Your question stays on this screen. Use the recovery action to continue the demonstration.','يبقى سؤالك في هذه الشاشة. استخدم إجراء الاستعادة لمتابعة التجربة.')}</p></div>`:''}`;}
function messageHTML(){return `<div class="message"><img src="${assets.default}" alt=""><div class="bubble">${greetingMessage()}</div></div>`+S.messages.map(m=>`<div class="message ${m.role==='user'?'user':''}">${m.role==='user'?'':`<img src="${assets.default}" alt="">`}<div class="bubble">${esc(m.content)}${m.role==='ai'?`<br><button class="source-chip" data-action="citation">${icon('documents')}${text('Source · p. 4 (sample)','المصدر · ص 4 (تجريبي)')}</button>`:''}</div></div>`).join('')+(S.busy?`<div class="message">${mascot('mascot-small')}<div class="bubble" role="status">${text('Rafeeq is thinking…','رفيق يفكر…')}</div></div>`:'');}
function quiz(){if(!S.quizStarted)return `<div class="quiz-wrap">${heading(text('A little practice. A deeper understanding.','تدريب بسيط، وفهم أعمق.'),text('Test what you learned, with helpful explanations along the way.','اختبر ما تعلمته، مع شروحات مفيدة خلال التدريب.'))}<div class="quiz-banner"><div><p class="eyebrow">${text('PRACTICE WITH RAFEEQ','تدرب مع رفيق')}</p><h2 style="margin-top:8px">${text('You don’t need to get it all right.','لا تحتاج للإجابة عن كل شيء بشكل صحيح.')}</h2><p class="small" style="margin-top:8px">${text('Every answer is a chance to learn.','كل إجابة فرصة للتعلم.')}</p></div>${mascot('mascot-small','greeting')}</div><div class="card stack"><div class="form-field"><label for="quiz-document">${text('Study document','مستند الدراسة')}</label><select id="quiz-document"><option value="0">Computer Networks.pdf</option></select></div><div class="row"><span class="pill">${text('3 sample questions','3 أسئلة تجريبية')}</span><span class="pill">${text('Multiple choice','اختيار من متعدد')}</span></div><p class="small">${text('This preview includes a fixed Computer Networks practice quiz. Production quizzes will be generated from the selected document by the shared backend.','تتضمن هذه المعاينة اختباراً ثابتاً لشبكات الحاسوب. ستُنشأ الاختبارات الفعلية من المستند المحدد عبر الخادم المشترك.')}</p><button class="btn primary" data-action="start-quiz" ${S.busy?'disabled':''}>${icon('quiz')}${text(S.busy?'Preparing your practice…':'Start practice',S.busy?'أجهز التدريب…':'ابدأ التدريب')}</button>${S.busy?`<div class="row">${mascot('mascot-small')}${status()}</div>`:''}</div></div>`;const q=questionBank[S.qi];return `<div class="quiz-wrap"><div class="quiz-banner"><div><p class="eyebrow">${text('COMPUTER NETWORKS','شبكات الحاسوب')}</p><h1 style="margin-top:8px">${text('Quiz time!','وقت الاختبار!')}</h1><p class="small">${text('Question','السؤال')} ${S.qi+1} ${text('of','من')} ${questionBank.length}</p></div>${mascot('mascot-small')}</div><div class="progress-track" aria-label="${text('Quiz progress','تقدم الاختبار')}"><div class="progress-fill" style="width:${(S.qi+1)/questionBank.length*100}%"></div></div><section class="card stack" style="margin-top:24px"><span class="pill" style="width:fit-content">${text('Multiple choice','اختيار من متعدد')}</span><h2>${text(...q.q)}</h2>${q.options.map((o,i)=>`<button class="quiz-option ${S.answer!==null?(i===q.correct?'correct':i===S.answer?'wrong':''):''}" data-answer="${i}" ${S.answer!==null?'disabled':''}><span class="option-letter">${'ABCD'[i]}</span><span class="grow">${Array.isArray(o)?text(...o):o}</span>${S.answer!==null&&i===q.correct?icon('check'):S.answer!==null&&i===S.answer?icon('close'):''}</button>`).join('')}${S.answer!==null?`<div class="feedback"><strong>${S.answer===q.correct?text('Correct — nicely done!','إجابة صحيحة — أحسنت!'):text('Keep going. Here’s why.','واصل المحاولة. إليك التفسير.')}</strong><p>${text(...q.why)}</p></div>${btn('next-question',S.qi===questionBank.length-1?'See results':'Next question',S.qi===questionBank.length-1?'عرض النتائج':'السؤال التالي',true,'arrow')}`:''}</section></div>`;}
function results(){const score=S.answers.filter((a,i)=>a===questionBank[i].correct).length;return `<div class="quiz-wrap"><div class="result-hero">${mascot('mascot-art',score>=2?'success':'encouraging')}<p class="eyebrow">${text('PRACTICE COMPLETE','اكتمل التدريب')}</p><h1>${score>=2?text('You’re making progress.','أنت تحرز تقدماً.'):text('A good start. Let’s keep learning.','بداية جيدة. لنواصل التعلم.')}</h1><div class="score">${score}<span class="muted" style="font-size:24px"> / ${questionBank.length}</span></div><p>${text('Understanding grows with practice. Review the ideas below.','الفهم يتطور بالتدريب. راجع الأفكار أدناه.')}</p><div class="row wrap">${btn('restart-quiz','Try again','حاول مجدداً',true,'quiz')}${btn('summary','Review material','راجع المادة',false,'book')}</div></div><h2 style="margin:28px 0 18px">${text('Your answer review','مراجعة إجاباتك')}</h2><div class="stack">${questionBank.map((q,i)=>`<div class="card"><div class="row"><span class="mini-check" style="${S.answers[i]===q.correct?'':'background:var(--tint);color:var(--primary-text)'}">${icon(S.answers[i]===q.correct?'check':'book')}</span><strong>${text(...q.q)}</strong></div><p style="margin-top:12px;font-size:14px">${text(...q.why)}</p><span class="pill ${S.answers[i]===q.correct?'success':''}" style="margin-top:12px">${S.answers[i]===q.correct?text('Correct','صحيح'):text('Worth revisiting','راجع هذه الفكرة')}</span></div>`).join('')}</div></div>`;}
function profile(){return `${heading(label('profile'),text('Make your study space feel like yours.','اجعل مساحة دراستك تناسبك.'))}<div class="card stack" style="max-width:650px"><div class="row"><span class="avatar" style="width:60px;height:60px">S</span><div><h2>${text('Student','طالب')}</h2><p class="small">${text('Fictional profile · design preview','ملف تجريبي · معاينة تصميم')}</p></div></div><div class="form-field"><label for="pref-language">${text('Interface language','لغة الواجهة')}</label><select id="pref-language"><option value="en" ${S.lang==='en'?'selected':''}>English</option><option value="ar" ${S.lang==='ar'?'selected':''}>العربية</option></select></div><div class="form-field"><label for="pref-theme">${text('Appearance','المظهر')}</label><select id="pref-theme"><option value="light" ${S.theme==='light'?'selected':''}>${text('Light','فاتح')}</option><option value="dark" ${S.theme==='dark'?'selected':''}>${text('Dark','داكن')}</option></select></div><div class="form-field"><label for="pref-dialect">${text('Conversational Arabic preference','تفضيل العربية في المحادثة')}</label><select id="pref-dialect"><option value="standard" ${S.dialect==='standard'?'selected':''}>${text('Standard Arabic','العربية الفصحى')}</option><option value="libyan" ${S.dialect==='libyan'?'selected':''}>${text('Libyan dialect','اللهجة الليبية')}</option></select><small>${text('The preference changes sample chat copy only in this prototype.','يغير هذا التفضيل نص الدردشة التجريبي فقط في هذه المعاينة.')}</small></div>${btn('onboarding','Meet Rafeeq again','تعرّف على رفيق مجدداً',false,'spark')}</div>`;}
function design(){return `${heading(text('The identity we agreed on.','الهوية التي اتفقنا عليها.'),text('Original Rafeeq. Blue, cyan, and purple. A study space that feels friendly and clear.','رفيق الأصلي. الأزرق والسماوي والبنفسجي. مساحة دراسة ودودة وواضحة.'))}<h2 style="margin-bottom:18px">${text('Four approved expressions','أربع تعبيرات معتمدة')}</h2><div class="design-grid">${Object.entries(assets).map(([key,src])=>`<div class="expression"><img src="${src}" alt="${text('Approved Rafeeq '+key,'تعبير رفيق المعتمد: '+key)}"><h3>${key}</h3></div>`).join('')}</div><section class="card" style="margin-top:28px"><div class="row wrap between"><div><h2>${text('Rafeeq reacts to the study flow.','رفيق يتفاعل مع رحلة التعلم.')}</h2><p class="small">${text('12 semantic states · 4 approved expression assets','12 حالة معنوية · 4 صور تعبير معتمدة')}</p></div><div class="row">${mascot('mascot-small')}${status()}</div></div><div class="form-field" style="max-width:420px;margin-top:20px"><label for="state-select">${text('Preview a state','عاين حالة')}</label><select id="state-select">${Object.keys(states).map(k=>`<option value="${k}" ${S.mascot===k?'selected':''}>${k} — ${text(states[k][1],states[k][2])}</option>`).join('')}</select></div><p class="small" style="margin-top:14px">${text('Reading and working use the thinking image; error and offline use the default image with clear status text. No unapproved poses are invented.','تستخدم القراءة والعمل صورة التفكير، ويستخدم الخطأ وانقطاع الاتصال الصورة الأساسية مع حالة نصية واضحة. لا تُضاف تعبيرات غير معتمدة.')}</p></section><h2 style="margin:28px 0 18px">${text('Brand foundations','أسس الهوية')}</h2><div class="swatches">${[['Primary','#2563EB'],['Secondary','#8B5CF6'],['Accent','#06B6D4'],['Highlight','#F97316'],['Dark','#0F172A'],['Light','#F8FAFC']].map(([n,c])=>`<div class="swatch"><i style="background:${c}"></i><div><strong>${n}</strong><br>${c}</div></div>`).join('')}</div><div class="card stack" style="margin-top:24px"><h2>${text('Clear learning, comfortable reading.','تعلم واضح، وقراءة مريحة.')}</h2><p>${text('Inter + proposed IBM Plex Sans Arabic. System fonts are used offline until production fonts are bundled.','Inter مع IBM Plex Sans Arabic المقترح. تستخدم المعاينة خطوط النظام إلى حين تضمين الخطوط النهائية.')}</p><div class="row wrap">${btn('go-chat','Primary action','إجراء أساسي',true)}${btn('all-docs','Secondary action','إجراء ثانوي')}<span class="pill success">${text('Ready with a label','جاهز مع وصف نصي')}</span></div></div><h2 style="margin:28px 0 18px">${text('Original visual reference','المرجع البصري الأصلي')}</h2><img class="board" src="../brand/brand-guidelines/approved-brand-board.jpeg" alt="${text('Approved original Fahmly brand board with Rafeeq, palette, desktop dashboards, and mobile screens','لوحة الهوية الأصلية المعتمدة لفهملي، وتتضمن رفيق والألوان وواجهات الويب والهاتف')}">`;}
function onboarding(){const steps=[{title:['Meet Rafeeq.','تعرّف على رفيق.'],desc:['Your AI study companion. A friendlier way to understand your lectures.','رفيقك الدراسي الذكي. طريقة ودودة لفهم محاضراتك.'],state:'happy'},{title:['Start with your material.','ابدأ بمادتك الدراسية.'],desc:['Bring a lecture, find the key ideas, and ask about what feels unclear.','أضف محاضرتك، واستكشف أهم الأفكار، واسأل عما لم تفهمه.'],state:'default'},{title:['Learn. Practice. Grow.','تعلّم. تدرّب. تقدّم.'],desc:['Turn understanding into confidence, one question at a time.','حوّل الفهم إلى ثقة، سؤالاً تلو الآخر.'],state:'success'}];const st=steps[S.onboard];return `<section class="onboarding"><p class="eyebrow">FAHMLY · ${text('YOUR SMARTER WAY TO LEARN','طريقتك الأذكى للتعلم')}</p><img class="mascot-art float" src="${assets[st.state]}" alt="${text('Approved Rafeeq expression','تعبير رفيق المعتمد')}"><h1>${text(...st.title)}</h1><p>${text(...st.desc)}</p><div class="benefits">${[['book','Understand your lectures','افهم محاضراتك'],['spark','Get clear explanations','احصل على شروحات واضحة'],['quiz','Practice with quizzes','تدرب بالاختبارات']].map(([i,e,a])=>`<div class="row"><span class="icon-tile">${icon(i)}</span>${text(e,a)}</div>`).join('')}</div><span class="small">${S.onboard+1} / 3</span>${btn('onboard-next',S.onboard===2?'Get started':'Continue',S.onboard===2?'ابدأ الآن':'متابعة',true,'arrow')}${btn('go-home','Skip for now','تخطّ الآن')}</section>`;}
function go(page){cancel();S.page=page;S.error=false;S.offline=false;S.mascot=page==='home'?'greeting':page==='quiz'?'quiz':page==='chat'?'idle':'idle';if(page==='home')later(()=>setState('idle'),1800);render();$('#main').focus({preventScroll:true});window.scrollTo({top:0});}
function openDoc(i){S.doc=i;S.tab='summary';S.messages=[];go('summary');}
function upload(name){if(S.processing)return;cancel();S.uploadName=name;S.processing=true;S.mascot='working';render();later(()=>{S.mascot='reading';render();},900);later(()=>{documents.unshift({name,ar:name,type:name.toLowerCase().endsWith('.pptx')?'PPTX':name.toLowerCase().endsWith('.docx')?'DOCX':'PDF',pages:12,age:['Added just now','أضيف الآن'],subject:['Example material','مادة تجريبية']});S.doc=0;S.processing=false;S.mascot='success';render();toast(text('Example ready — no file was uploaded or processed.','المثال جاهز — لم يُرفع أي ملف أو يُعالج.'));},2100);}
function submitQuestion(value){if(S.busy||!value.trim())return;if(S.offline||S.error){toast(text('Use the recovery action to continue.','استخدم إجراء الاستعادة للمتابعة.'));return;}const q=value.trim().slice(0,1200);S.messages.push({role:'user',content:q});S.busy=true;S.mascot='thinking';render();later(()=>{const content=S.lang==='ar'?(S.dialect==='libyan'?'خلّينا نبسطوها: الشبكة تربط الأجهزة باش تتبادل البيانات. TCP يتأكد إن البيانات توصل بالترتيب، وUDP يرسل بسرعة من غير نفس ضمانات الوصول. هذا رد تجريبي ثابت للمعاينة.':'ببساطة: تربط الشبكة الأجهزة لتبادل البيانات. يتحقق TCP من وصول البيانات بالترتيب، بينما يركز UDP على الإرسال السريع دون ضمانات الوصول نفسها. هذا رد تجريبي ثابت للمعاينة.'):'Here’s a simpler way to think about it: a network connects devices so they can share data. TCP checks that the data arrives in order; UDP sends it with less overhead and without the same guarantees. This is a fixed sample reply for design review.';S.messages.push({role:'ai',content});S.busy=false;S.mascot='explaining';render();$('#messages').scrollTop=$('#messages').scrollHeight;},1400);}
function action(a){switch(a){case'phone':S.phone=!S.phone;render();break;case'theme':S.theme=S.theme==='light'?'dark':'light';render();break;case'lang':S.lang=S.lang==='en'?'ar':'en';render();break;case'design':go('design');break;case'go-home':go('home');break;case'go-chat':go('chat');break;case'go-quiz':S.quizStarted=false;S.doc=documents.findIndex(d=>d.name==='Computer Networks.pdf');go('quiz');break;case'all-docs':S.query='';go('documents');break;case'upload-page':S.query='';go('documents');$('#file-input').focus();break;case'summary':go('summary');break;case'explain':go('chat');$('#chat-input').value=text('Explain this lecture simply.','اشرح هذه المحاضرة ببساطة.');setState('listening');$('#chat-input').focus();break;case'sample-upload':if(!S.processing)upload('Lecture Example.pdf');break;case'citation':S.tab='summary';go('summary');toast(text('Example source: page 4. A real viewer will highlight the cited passage.','مصدر تجريبي: الصفحة 4. سيبرز العارض الفعلي المقطع المشار إليه.'));break;case'ask-summary':submitQuestion(text('Summarize this document.','لخّص هذا المستند.'));break;case'ask-explain':submitQuestion(text('Explain TCP and UDP simply.','اشرح TCP وUDP ببساطة.'));break;case'start-quiz':if(S.busy)break;cancel();S.doc=documents.findIndex(d=>d.name==='Computer Networks.pdf');S.busy=true;S.mascot='thinking';render();later(()=>{S.busy=false;S.quizStarted=true;S.qi=0;S.answers=[];S.answer=null;S.mascot='quiz';render();},1000);break;case'next-question':if(S.answer===null)break;S.answers[S.qi]=S.answer;if(S.qi===questionBank.length-1){S.page='results';S.mascot=S.answers.filter((x,i)=>x===questionBank[i].correct).length>=2?'success':'encouraging';render();window.scrollTo({top:0});}else{S.qi++;S.answer=null;S.mascot='quiz';render();}break;case'restart-quiz':S.quizStarted=false;S.answers=[];S.answer=null;go('quiz');break;case'simulate-error':cancel();S.error=true;S.offline=false;S.mascot='error';render();break;case'simulate-offline':cancel();S.offline=true;S.error=false;S.mascot='offline';render();break;case'recover':S.error=false;S.offline=false;S.mascot='idle';render();toast(text('Recovery demonstrated. No network request was made.','تمت معاينة الاستعادة. لم يُرسل أي طلب شبكي.'));break;case'onboarding':S.onboard=0;go('onboarding');break;case'onboard-next':if(S.onboard===2)go('home');else{S.onboard++;render();}break;}}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action)));document.querySelectorAll('[data-doc]').forEach(b=>b.addEventListener('click',()=>openDoc(Number(b.dataset.doc))));document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.tab;render();$('#tab-'+S.tab).focus();}));document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{if(S.answer!==null)return;S.answer=Number(b.dataset.answer);S.mascot=S.answer===questionBank[S.qi].correct?'success':'encouraging';render();$('#announcer').textContent=text(S.answer===questionBank[S.qi].correct?'Correct answer':'Review the explanation',S.answer===questionBank[S.qi].correct?'إجابة صحيحة':'راجع الشرح');}));if($('#search-form'))$('#search-form').addEventListener('submit',e=>{e.preventDefault();S.query=$('#global-search').value.trim();go('documents');});if($('#file-input'))$('#file-input').addEventListener('change',e=>{const f=e.target.files[0];if(f){if(!/\.(pdf|pptx|docx)$/i.test(f.name)){toast(text('Choose a PDF, PPTX, or DOCX for this example.','اختر ملف PDF أو PPTX أو DOCX لهذه التجربة.'));return;}upload(f.name);}});if($('#chat-form'))$('#chat-form').addEventListener('submit',e=>{e.preventDefault();submitQuestion($('#chat-input').value);});if($('#chat-input')){$('#chat-input').addEventListener('input',e=>setState(e.target.value.trim()?'listening':'idle'));$('#chat-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitQuestion(e.target.value);}});}if($('#state-select'))$('#state-select').addEventListener('change',e=>setState(e.target.value));if($('#pref-language'))$('#pref-language').addEventListener('change',e=>{S.lang=e.target.value;render();});if($('#pref-theme'))$('#pref-theme').addEventListener('change',e=>{S.theme=e.target.value;render();});if($('#pref-dialect'))$('#pref-dialect').addEventListener('change',e=>{S.dialect=e.target.value;toast(text('Preview preference updated.','تم تحديث تفضيل المعاينة.'));});}
render();setState('greeting');later(()=>setState('idle'),1800);
</script>
</body>
